name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hassfest tracks Home Assistant's own moving requirements, so a manifest
    # that validates today can stop validating without this repo changing.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  # HACS validation is deliberately absent for now. It fails on
  # <Validation brands> until this integration is listed in
  # home-assistant/brands, and opening that pull request for something that
  # does not yet control a device would be premature. A check that is expected
  # to be red teaches people to ignore CI, so it comes back when there is
  # something installable to validate - see the build order in ARCHITECTURE.md.

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components/
      - run: ruff format --check custom_components/
